# Builds the Flatpak from this checkout:
#
#   flatpak-builder --user --install --force-clean build packaging/flatpak/io.github.julio0cesar.lyricslens.yml
#
# The copy submitted to Flathub is the same file with the `dir` source replaced
# by the release tag. cargo-sources.json comes from Cargo.lock, through
# flatpak-builder-tools' flatpak-cargo-generator.py, and is regenerated whenever
# the lock file changes.
id: io.github.julio0cesar.lyricslens
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: lyricslens
finish-args:
  # The overlay is a layer surface on Wayland, and an X11 window where the
  # compositor has no layer-shell.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Lyrics and covers come from LRCLIB and the cover services.
  - --share=network
  # What is playing, from any MPRIS player.
  - --talk-name=org.mpris.MediaPlayer2.*
  # The icon in the status bar.
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: gtk4-layer-shell
    buildsystem: meson
    config-opts:
      - -Dintrospection=false
      - -Dvapi=false
      - -Dsmoke-tests=false
    sources:
      - type: archive
        url: https://github.com/wmww/gtk4-layer-shell/archive/refs/tags/v1.3.0.tar.gz
        sha256: 1ebb01ab14e98afd1727f68f64981c37bd23305b1f131f5667c02b94cf593192
    cleanup:
      - /include
      - /lib/pkgconfig

  - name: lyricslens
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/lyricslens/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/lyricslens -t /app/bin/
      - ln -s lyricslens /app/bin/lls
      - install -Dm644 packaging/lyricslens.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-icon=${FLATPAK_ID} /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 packaging/flatpak/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - |
        for size in 32 64 128 256; do
          install -Dm644 packaging/icons/$size.png /app/share/icons/hicolor/${size}x${size}/apps/${FLATPAK_ID}.png
        done
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - build
          - .flatpak-builder
      - cargo-sources.json
