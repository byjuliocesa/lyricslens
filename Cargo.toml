[package]
name = "lyricslens"
version = "0.1.45"
description = "Synchronized lyrics overlay for the desktop"
edition = "2024"
license = "MIT"
repository = "https://github.com/byjuliocesa/lyricslens"


[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
gdk4-x11 = "0.11"
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
ksni = { version = "0.3.6", features = ["blocking"] }
png = "0.18.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x11rb = "0.14.0"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
async-channel = "2.5.0"
futures-util = "0.3.34"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

# The .deb built on release. The runtime libraries are named so that
# `apt install ./lyricslens.deb` pulls them in; `dpkg -i` never does.
# gtk4-layer-shell is not among them: it is built into the binary, because
# Ubuntu has no package for it at all.
[package.metadata.deb]
maintainer = "Julio Cesar <julio@byjuliocesa.dev>"
section = "sound"
priority = "optional"
depends = "libgtk-4-1, libadwaita-1-0, libx11-6"
extended-description = """
Reads what your player is playing over MPRIS, finds the lyrics on LRCLIB and \
draws the line being sung on a layer above every other window."""
assets = [
    ["target/release/lyricslens", "usr/bin/", "755"],
    ["packaging/lyricslens.desktop", "usr/share/applications/", "644"],
    ["packaging/icons/32.png", "usr/share/icons/hicolor/32x32/apps/lyricslens.png", "644"],
    ["packaging/icons/64.png", "usr/share/icons/hicolor/64x64/apps/lyricslens.png", "644"],
    ["packaging/icons/128.png", "usr/share/icons/hicolor/128x128/apps/lyricslens.png", "644"],
    ["packaging/icons/256.png", "usr/share/icons/hicolor/256x256/apps/lyricslens.png", "644"],
    ["README.md", "usr/share/doc/lyricslens/README.md", "644"],
    ["packaging/completions/lyricslens.bash", "usr/share/bash-completion/completions/lyricslens", "644"],
    ["packaging/completions/lyricslens.bash", "usr/share/bash-completion/completions/lls", "644"],
    ["packaging/completions/_lyricslens", "usr/share/zsh/vendor-completions/_lyricslens", "644"],
    ["packaging/completions/lyricslens.fish", "usr/share/fish/vendor_completions.d/lyricslens.fish", "644"],
    ["packaging/completions/lyricslens.fish", "usr/share/fish/vendor_completions.d/lls.fish", "644"],
]

# And the .rpm. Fedora and openSUSE spell the same libraries differently, so
# the requirement is on the shared objects rather than on package names.
[package.metadata.generate-rpm]
summary = "Synced lyrics over any window"
assets = [
    { source = "target/release/lyricslens", dest = "/usr/bin/lyricslens", mode = "755" },
    { source = "packaging/lyricslens.desktop", dest = "/usr/share/applications/lyricslens.desktop", mode = "644" },
    { source = "packaging/icons/32.png", dest = "/usr/share/icons/hicolor/32x32/apps/lyricslens.png", mode = "644" },
    { source = "packaging/icons/64.png", dest = "/usr/share/icons/hicolor/64x64/apps/lyricslens.png", mode = "644" },
    { source = "packaging/icons/128.png", dest = "/usr/share/icons/hicolor/128x128/apps/lyricslens.png", mode = "644" },
    { source = "packaging/icons/256.png", dest = "/usr/share/icons/hicolor/256x256/apps/lyricslens.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/lyricslens/README.md", mode = "644" },
    { source = "packaging/completions/lyricslens.bash", dest = "/usr/share/bash-completion/completions/lyricslens", mode = "644" },
    { source = "packaging/completions/lyricslens.bash", dest = "/usr/share/bash-completion/completions/lls", mode = "644" },
    { source = "packaging/completions/_lyricslens", dest = "/usr/share/zsh/site-functions/_lyricslens", mode = "644" },
    { source = "packaging/completions/lyricslens.fish", dest = "/usr/share/fish/vendor_completions.d/lyricslens.fish", mode = "644" },
    { source = "packaging/completions/lyricslens.fish", dest = "/usr/share/fish/vendor_completions.d/lls.fish", mode = "644" },
]

[package.metadata.generate-rpm.requires]
"libgtk-4.so.1()(64bit)" = "*"
"libadwaita-1.so.0()(64bit)" = "*"
